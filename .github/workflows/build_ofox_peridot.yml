name: Build OrangeFox Recovery - Xiaomi Peridot

on:
  workflow_dispatch:
    inputs:
      SYNC_DEPTH:
        description: "Repo sync depth (1 = shallow, lebih cepat)"
        required: false
        default: "1"
      RELEASE_TAG:
        description: "Tag untuk release (kosongkan jika tidak mau upload)"
        required: false
        default: ""

jobs:
  build:
    name: Build OrangeFox for peridot
    runs-on: ubuntu-22.04
    env:
      DEVICE_CODENAME: peridot
      DEVICE_TREE_URL: https://github.com/KazeTheLight/ofox_device_xiaomi_peridot
      DEVICE_TREE_BRANCH: fox_14.1
      OFOX_BRANCH: fox_14.1
      BUILD_TARGET: recoveryimage

    steps:
      # ─── Setup Environment ─────────────────────────────────────────────────
      - name: Checkout (untuk akses secrets & workflows)
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 \
            libssl-dev schedtool ccache lzop bc \
            patchelf gperf liblz4-tool squashfs-tools \
            python3-pip openjdk-11-jdk rsync libelf-dev \
            libncurses5 libncurses5-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "5G"
          key: ofox-peridot-${{ env.OFOX_BRANCH }}

      # ─── Repo Init & Sync ──────────────────────────────────────────────────
      - name: Setup repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize OrangeFox manifest
        run: |
          mkdir -p ${{ github.workspace }}/OrangeFox
          cd ${{ github.workspace }}/OrangeFox
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          repo init \
            -u https://gitlab.com/OrangeFox/sync.git \
            -b ${{ env.OFOX_BRANCH }} \
            --depth=${{ github.event.inputs.SYNC_DEPTH }}

      - name: Sync OrangeFox sources
        run: |
          cd ${{ github.workspace }}/OrangeFox
          repo sync \
            -c --no-clone-bundle --no-tags \
            --optimized-fetch --prune \
            -j$(nproc --all)

      # ─── Clone Device Tree ─────────────────────────────────────────────────
      - name: Clone device tree
        run: |
          cd ${{ github.workspace }}/OrangeFox
          git clone \
            ${{ env.DEVICE_TREE_URL }} \
            --branch ${{ env.DEVICE_TREE_BRANCH }} \
            --depth=1 \
            device/xiaomi/${{ env.DEVICE_CODENAME }}

      # ─── Build ─────────────────────────────────────────────────────────────
      - name: Set up build environment & build
        run: |
          cd ${{ github.workspace }}/OrangeFox
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=${{ env.DEVICE_CODENAME }}
          export LC_ALL=C

          source build/envsetup.sh
          lunch twrp_${{ env.DEVICE_CODENAME }}-eng

          mka adbd ${{ env.BUILD_TARGET }}

      # ─── Collect Output ────────────────────────────────────────────────────
      - name: Find and collect recovery image
        run: |
          cd ${{ github.workspace }}/OrangeFox
          mkdir -p ${{ github.workspace }}/output

          # Cari file output OrangeFox
          find out/target/product/${{ env.DEVICE_CODENAME }} \
            -maxdepth 1 \
            \( -name "OrangeFox*.zip" \
               -o -name "recovery.img" \
               -o -name "boot.img" \) \
            -exec cp {} ${{ github.workspace }}/output/ \;

          echo "=== Output files ==="
          ls -lh ${{ github.workspace }}/output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-peridot-${{ github.run_number }}
          path: ${{ github.workspace }}/output/
          retention-days: 7

      # ─── Release (opsional) ────────────────────────────────────────────────
      - name: Create GitHub Release
        if: ${{ github.event.inputs.RELEASE_TAG != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.RELEASE_TAG }}
          name: "OrangeFox Recovery - Xiaomi Peridot (${{ github.event.inputs.RELEASE_TAG }})"
          body: |
            ## OrangeFox Recovery for Xiaomi Peridot (peridot)

            **Branch:** `${{ env.OFOX_BRANCH }}`
            **Device Tree:** ${{ env.DEVICE_TREE_URL }}
            **Build Date:** ${{ github.run_number }}

            ### Cara Flash
            1. Boot ke fastboot
            2. `fastboot flash recovery recovery.img`
            3. Atau gunakan `.zip` via sideload

            > ⚠️ Pastikan backup sebelum flash!
          files: ${{ github.workspace }}/output/*
          draft: false
          prerelease: false
