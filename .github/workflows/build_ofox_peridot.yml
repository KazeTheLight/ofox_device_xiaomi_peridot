name: Build OrangeFox Recovery - Xiaomi Peridot

on:
  workflow_dispatch:
    inputs:
      RELEASE_TAG:
        description: "Tag untuk GitHub Release (kosongkan jika skip release)"
        required: false
        default: ""

jobs:
  build:
    name: Build OrangeFox for peridot
    runs-on: ubuntu-22.04
    env:
      DEVICE_CODENAME: peridot
      DEVICE_TREE_URL: https://github.com/KazeTheLight/ofox_device_xiaomi_peridot
      DEVICE_TREE_BRANCH: fox_14.1
      FOX_SYNC_PATH: ${{ github.workspace }}/fox_14.1

    steps:
      # ─── Maximize disk space ───────────────────────────────────────────────
      - name: Maximize disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      # ─── Setup Environment ─────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev \
            libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 python3-pip \
            libssl-dev schedtool ccache lzop bc \
            patchelf gperf liblz4-tool squashfs-tools \
            openjdk-11-jdk rsync libelf-dev \
            libncurses5 libncurses5-dev aria2

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "10G"
          key: ofox-peridot-fox14.1

      - name: Setup repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

      # ─── Sync OrangeFox via orangefox_sync.sh ─────────────────────────────
      - name: Clone OrangeFox sync script
        run: |
          mkdir -p ${{ github.workspace }}/ofox_sync
          git clone https://gitlab.com/OrangeFox/sync.git \
            ${{ github.workspace }}/ofox_sync --depth=1

      - name: Run orangefox_sync.sh
        run: |
          cd ${{ github.workspace }}/ofox_sync
          chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch 14.1 --path ${{ env.FOX_SYNC_PATH }}

      # ─── Clone Device Tree ─────────────────────────────────────────────────
      - name: Clone device tree
        run: |
          git clone \
            ${{ env.DEVICE_TREE_URL }} \
            --branch ${{ env.DEVICE_TREE_BRANCH }} \
            --depth=1 \
            ${{ env.FOX_SYNC_PATH }}/device/xiaomi/${{ env.DEVICE_CODENAME }}

      # ─── Build ─────────────────────────────────────────────────────────────
      - name: Build OrangeFox
        run: |
          cd ${{ env.FOX_SYNC_PATH }}
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=${{ env.DEVICE_CODENAME }}
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export LC_ALL=C

          source build/envsetup.sh
          lunch twrp_${{ env.DEVICE_CODENAME }}-ap2a-eng
          mka adbd recoveryimage 2>&1 | tee ${{ github.workspace }}/build.log

      # ─── Collect Output ────────────────────────────────────────────────────
      - name: Collect output files
        run: |
          mkdir -p ${{ github.workspace }}/output
          find ${{ env.FOX_SYNC_PATH }}/out/target/product/${{ env.DEVICE_CODENAME }} \
            -maxdepth 1 \
            \( -name "OrangeFox*.zip" \
               -o -name "OrangeFox*.img" \
               -o -name "recovery.img" \) \
            -exec cp {} ${{ github.workspace }}/output/ \; || true
          echo "=== Output files ==="
          ls -lh ${{ github.workspace }}/output/ || echo "No output files found!"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ github.workspace }}/build.log
          retention-days: 3

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-peridot-${{ github.run_number }}
          path: ${{ github.workspace }}/output/
          retention-days: 7

      # ─── Release (opsional) ────────────────────────────────────────────────
      - name: Create GitHub Release
        if: ${{ github.event.inputs.RELEASE_TAG != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.RELEASE_TAG }}
          name: "OrangeFox Recovery - Xiaomi Peridot (${{ github.event.inputs.RELEASE_TAG }})"
          body: |
            ## OrangeFox Recovery for Xiaomi Peridot

            **Branch:** `fox_14.1`
            **Device Tree:** ${{ env.DEVICE_TREE_URL }}

            ### Cara Flash
            1. Boot ke fastboot mode
            2. `fastboot flash recovery recovery.img`
            3. Reboot ke recovery

            > ⚠️ Backup data sebelum flash!
          files: ${{ github.workspace }}/output/*
          draft: false
          prerelease: true            \( -name "OrangeFox*.zip" \
               -o -name "OrangeFox*.img" \
               -o -name "recovery.img" \) \
            -exec cp {} ${{ github.workspace }}/output/ \; || true
          echo "=== Output files ==="
          ls -lh ${{ github.workspace }}/output/ || echo "No output files found!"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ github.workspace }}/build.log
          retention-days: 3

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-peridot-${{ github.run_number }}
          path: ${{ github.workspace }}/output/
          retention-days: 7

      # ─── Release (opsional) ────────────────────────────────────────────────
      - name: Create GitHub Release
        if: ${{ github.event.inputs.RELEASE_TAG != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.RELEASE_TAG }}
          name: "OrangeFox Recovery - Xiaomi Peridot (${{ github.event.inputs.RELEASE_TAG }})"
          body: |
            ## OrangeFox Recovery for Xiaomi Peridot

            **Branch:** `fox_14.1`
            **Device Tree:** ${{ env.DEVICE_TREE_URL }}

            ### Cara Flash
            1. Boot ke fastboot mode
            2. `fastboot flash recovery recovery.img`
            3. Reboot ke recovery

            > ⚠️ Backup data sebelum flash!
          files: ${{ github.workspace }}/output/*
          draft: false
          prerelease: true
